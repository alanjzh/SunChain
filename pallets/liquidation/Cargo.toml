[package]
name = "pallet-liquidation"
description = "Permissionless liquidation entry point for the Sunchain perpetual exchange (Phase 2 §8)."
version = "0.1.0"
license = "MIT-0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
exchange-primitives.workspace = true
# Only used by `weights.rs`, which derives this pallet's weights from the engine's measured
# components. The dependency direction is the one the design allows: liquidation -> core.
pallet-exchange-core.workspace = true
frame-support.workspace = true
frame-system.workspace = true
log = { workspace = true, optional = true }
scale-info = { features = ["derive"], workspace = true }
sp-runtime.workspace = true
sp-std.workspace = true

[dev-dependencies]
sp-io = { default-features = true, workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"exchange-primitives/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-exchange-core/std",
	"scale-info/std",
	"sp-runtime/std",
	"sp-std/std",
]
runtime-benchmarks = [
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
]
