[workspace.package]
license = "MIT-0"
authors = ["Onecloud Technologies "]
homepage = "https://abc.onecloud.com"
repository = "https://github.com/paritytech/polkadot-sdk-solochain-template.git"
edition = "2021"

[workspace]
members = [
    "node",
    "admin",
    "node/inspect",
    "node/client/babe-consensus-data-provider",
    "node/client/ecdsa-keyring",
    # "node/node_state",
    "node/mulet",
    "pallets/template",
    "pallets/exchange-core",
    "pallets/exchange-primitives",
    "pallets/insurance",
    "pallets/liquidation",
    "pallets/oracle",
    "pallets/sunlead",
    "runtime",
    "langto_binding",
    # "sc-network",
    "crates/sunlead-primitives",
    "crates/sunlead-schedule",
    "crates/sunlead-verifier",
]
resolver = "2"
default-members = [
  "node",
  "node/inspect",
  "node/client/babe-consensus-data-provider",
  "node/client/ecdsa-keyring",
  # "node/node_state",
  "node/mulet",
  "runtime",
  "pallets/template",
  "pallets/exchange-core",
  "pallets/exchange-primitives",
  "pallets/insurance",
  "pallets/liquidation",
  "pallets/oracle",
  "admin",
  "langto_binding"
]

