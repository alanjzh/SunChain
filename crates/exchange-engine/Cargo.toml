[package]
name = "exchange-engine"
description = "Deterministic in-memory order book and matching state machine for SunChain."
version = "0.1.0"
license = "MIT-0"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
exchange-primitives.workspace = true
scale-info = { features = ["derive"], workspace = true }
sp-core.workspace = true

[features]
default = ["std"]
std = ["codec/std", "exchange-primitives/std", "scale-info/std", "sp-core/std"]
