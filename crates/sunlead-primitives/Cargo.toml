[package]
name = "sunlead-primitives"
version = "0.1.0"
license = "MIT-0"
edition = "2021"
description = "SunLead deterministic-leader consensus: shared primitives, digest, snapshot, evidence and crypto types."
publish = false

[dependencies]
codec = { features = ["derive", "max-encoded-len"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
sp-core = { default-features = false, workspace = true }
sp-runtime = { default-features = false, workspace = true }
sp-application-crypto = { default-features = false, workspace = true }
sp-consensus-slots = { default-features = false, workspace = true }
sp-crypto-hashing = { default-features = false, workspace = true }

[dev-dependencies]
sp-core = { default-features = true, workspace = true }

[features]
default = ["std"]
std = [
	"codec/std",
	"scale-info/std",
	"sp-core/std",
	"sp-runtime/std",
	"sp-application-crypto/std",
	"sp-consensus-slots/std",
	"sp-crypto-hashing/std",
]
