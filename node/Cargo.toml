[package]
name = "sunchain"
description = "A Sunchain node built with OSE Environment."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

build = "build.rs"

[lib]
name = "sunchain"
crate-type = [
    "staticlib",  # Ensure it gets compiled as a (static) C library
    "cdylib",     # If you want a shared/dynamic C library (advanced)
    "lib",        # For `generate-headers`, `examples/`, `tests/` etc.
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
log.workspace = true
pallet-exchange-core = { path = "../pallets/exchange-core", default-features = false }
frame-support.workspace = true
array-bytes = { workspace = true, default-features = true }
clap = { features = ["derive"], workspace = true }
frame-benchmarking-cli.default-features = true
frame-benchmarking-cli.workspace = true
frame-metadata-hash-extension.default-features = true
frame-metadata-hash-extension.workspace = true
frame-system.default-features = true
frame-system.workspace = true
futures = { features = ["thread-pool"], workspace = true }
jsonrpsee = { features = ["server"], workspace = true }
pallet-transaction-payment-rpc.default-features = true
pallet-transaction-payment-rpc.workspace = true
pallet-transaction-payment.default-features = true
pallet-transaction-payment.workspace = true
sc-basic-authorship.default-features = true
sc-basic-authorship.workspace = true
sc-cli.default-features = true
sc-cli.workspace = true
sc-client-api.default-features = true
sc-client-api.workspace = true
sc-consensus-aura.default-features = true
sc-consensus-aura.workspace = true
sc-consensus-grandpa.default-features = true
sc-consensus-grandpa.workspace = true
sc-consensus.default-features = true
sc-consensus.workspace = true
sc-chain-spec.workspace = true
sc-executor.default-features = true
sc-executor.workspace = true
sc-network.default-features = true
sc-network.workspace = true
sc-offchain.default-features = true
sc-offchain.workspace = true
sc-service.default-features = true
sc-service.workspace = true
sc-telemetry.default-features = true
sc-telemetry.workspace = true
sc-transaction-pool-api.default-features = true
sc-transaction-pool-api.workspace = true
sc-transaction-pool.default-features = true
sc-transaction-pool.workspace = true
sunchain-runtime.workspace = true
sp-api.default-features = true
sp-api.workspace = true
sp-block-builder.default-features = true
sp-block-builder.workspace = true
sp-blockchain.default-features = true
sp-blockchain.workspace = true
sp-consensus-aura.default-features = true
sp-consensus-aura.workspace = true
sp-core.default-features = true
sp-core.workspace = true
sp-genesis-builder.default-features = true
sp-genesis-builder.workspace = true
sp-inherents.default-features = true
sp-inherents.workspace = true
sp-io.default-features = true
sp-io.workspace = true
sp-keyring.default-features = true
sp-keyring.workspace = true
sp-runtime.default-features = true
sp-runtime.workspace = true
sp-timestamp.default-features = true
sp-timestamp.workspace = true
substrate-frame-rpc-system.default-features = true
substrate-frame-rpc-system.workspace = true
sp-tracing.workspace = true
scale-codec.workspace = true

serde = { features = ["derive"], workspace = true, default-features = true }
pallet-oracle.workspace = true
exchange-primitives.workspace = true
serde_json = { workspace = true, default-features = true }
# `gzip`: the full-book endpoints answer ~1.9 MB uncompressed and ~284 kB gzipped, and
# reqwest does not enable compression by default.
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "blocking", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
thiserror = "1.0"

sc-authority-discovery.workspace = true
sc-consensus-babe.workspace = true
sc-consensus-babe.default-features = true
sc-sync-state-rpc.workspace = true
sc-sysinfo.workspace = true
sc-storage-monitor.workspace = true
sc-consensus-epochs.workspace = true
sc-block-builder.workspace = true
sp-consensus-babe.workspace = true
sp-consensus-babe.default-features = true
sp-authority-discovery.workspace = true
sp-consensus-grandpa.workspace = true
sp-consensus-grandpa.default-features = true
sp-staking.workspace = true
sp-staking.default-features = true
pallet-im-online.workspace = true
sc-rpc = { workspace = true, default-features = true }
sp-application-crypto = { workspace = true, default-features = true }
sp-consensus = { workspace = true, default-features = true }
sp-keystore = { workspace = true, default-features = true }
sc-consensus-grandpa-rpc = { workspace = true, default-features = true }
sc-consensus-babe-rpc = { workspace = true, default-features = true }
sc-consensus-slots = { workspace = true, default-features = true }
sc-network-sync = { workspace = true, default-features = true }
substrate-state-trie-migration-rpc = { workspace = true, default-features = true }
sp-transaction-storage-proof = { workspace = true, default-features = true }

node-inspect = { optional = true, workspace = true, default-features = true }
safer-ffi = { workspace = true, default-features = true }

sp-transaction-pool = { workspace = true, features = ["default"] }
sp-offchain = { workspace = true, features = ["default"] }
sp-session = { workspace = true, features = ["default"] }
frame-system-rpc-runtime-api = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }


sc-consensus-beefy = {workspace = true}
sc-consensus-beefy-rpc = { workspace = true }
sp-consensus-beefy = {workspace = true}
sc-rpc-api = {workspace = true}
sp-statement-store = { workspace = true }
sc-rpc-spec-v2 = { workspace = true }
mmr-rpc = { workspace = true }


# Frontier
fc-api = { workspace = true }
fc-cli = { workspace = true }
fc-consensus = { workspace = true }
fc-db = { workspace = true }
fc-mapping-sync = { workspace = true}
fc-rpc = { workspace = true, features = ["aura"] }
fc-rpc-core = { workspace = true }
fc-storage = { workspace = true }
fp-account = { workspace = true }
fp-dynamic-fee = { workspace = true, features = ["default"] }
fp-evm = { workspace = true, features = ["default"] }
fp-rpc = { workspace = true, features = ["default"] }
# frontier-template-runtime = { workspace = true, features = ["std"] }
# Cumulus primitives
cumulus-primitives-proof-size-hostfunction = { workspace = true }
babe-consensus-data-provider = { path = "client/babe-consensus-data-provider" }
ecdsa-keyring = { path = "client/ecdsa-keyring" }


[build-dependencies]
substrate-build-script-utils.default-features = true
substrate-build-script-utils.workspace = true

node-inspect = { optional = true, workspace = true, default-features = true }

[features]
default = [
	"std",
	"rocksdb",
	"sql",
	"txpool",
	"rpc-binary-search-estimate",
	]
std = ["sunchain-runtime/std", "node-inspect"]
# Dependencies that are only required if runtime benchmarking should be build.
runtime-benchmarks = [
	"frame-benchmarking-cli/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-transaction-payment/runtime-benchmarks",
	"sc-service/runtime-benchmarks",
	"sunchain-runtime/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
# Enable features that allow the runtime to be tried and debugged. Name might be subject to change
# in the near future.
try-runtime = [
	"frame-system/try-runtime",
	"pallet-transaction-payment/try-runtime",
	"sunchain-runtime/try-runtime",
	"sp-runtime/try-runtime",
]
# Metadata hash and logging off, for release builds (runtime/Cargo.toml has the real switch).
on-chain-release-build = ["sunchain-runtime/on-chain-release-build"]

sql = [
	"fc-db/sql",
	"fc-mapping-sync/sql",
]

rocksdb = [
	"sc-cli/rocksdb",
	"sc-service/rocksdb",
	"fc-cli/rocksdb",
	"fc-db/rocksdb",
	"fc-mapping-sync/rocksdb",
	"fc-rpc/rocksdb"
]

txpool = ["fc-rpc/txpool"]

rpc-binary-search-estimate = ["fc-rpc/rpc-binary-search-estimate"]