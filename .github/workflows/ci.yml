name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - if: contains(matrix.os, 'ubuntu')
        uses: ./.github/actions/free-disk-space
      - if: contains(matrix.os, 'ubuntu')
        uses: ./.github/actions/ubuntu-dependencies
      - if: contains(matrix.os, 'macos')
        uses: ./.github/actions/macos-dependencies

      - name: Build the template
        run: cargo build
        timeout-minutes: 90

      - name: Run clippy
        run: |
          SKIP_WASM_BUILD=1 cargo clippy --all-targets --locked --workspace --quiet
          SKIP_WASM_BUILD=1 cargo clippy --all-targets --all-features --locked --workspace --quiet
        timeout-minutes: 30

      - name: Run the tests
        run: SKIP_WASM_BUILD=1 cargo test
        timeout-minutes: 15

      - name: Run the feature-gated tests
        # `try-runtime` and `runtime-benchmarks` are OFF by default, which is precisely how two
        # real defects stayed hidden until they were run by hand:
        #   * `pre_upgrade` counted pre-migration values with the post-migration type, so it
        #     always reported 0 and the hook could never have passed on a real chain;
        #   * five benchmarks in `pallet-exchange-core` were broken outright.
        # Keep this step: a green default `cargo test` says nothing about either.
        # Note: there is deliberately no `cargo test -p pallet-exchange-core --features
        # try-runtime`. Building the pallet in isolation fails inside the third-party
        # `pallet-revive`, which implements `Checkable` under a `try-runtime` cfg of its own and
        # is not a direct dependency we can propagate the feature to. The runtime-level run
        # below is the one that matters anyway: it is what actually executes the hooks.
        run: |
          SKIP_WASM_BUILD=1 cargo test -p sunchain-runtime --features try-runtime --test migration
          SKIP_WASM_BUILD=1 cargo test -p pallet-exchange-core --features runtime-benchmarks
          SKIP_WASM_BUILD=1 cargo test -p pallet-liquidation
        timeout-minutes: 30

      - name: Build the docs
        run: SKIP_WASM_BUILD=1 cargo doc --workspace --no-deps
        timeout-minutes: 15

  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/ubuntu-dependencies

      # The default `build` job runs everything with SKIP_WASM_BUILD, so a break that only
      # shows up in the no_std/WASM target is otherwise caught solely by the slow release
      # node build. This checks the runtime compiles to the WASM the chain actually executes,
      # quickly and on its own (S3-3).
      - name: Check the runtime compiles to WASM
        run: cargo check -p sunchain-runtime
        timeout-minutes: 30

  run-node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - if: contains(matrix.os, 'ubuntu')
        uses: ./.github/actions/free-disk-space
      - if: contains(matrix.os, 'ubuntu')
        uses: ./.github/actions/ubuntu-dependencies
      - if: contains(matrix.os, 'macos')
        uses: ./.github/actions/macos-dependencies

      - name: Build the node individually in release mode
        # The template's package name (`solochain-template-node`) does not exist here; this
        # workspace's node crate is `sunchain`.
        run: cargo build --package sunchain --release
        timeout-minutes: 90

      - name: Make sure the node is producing blocks
        run: |
          ./target/release/sunchain --dev 2>&1 | tee out.txt &
          until curl -s '127.0.0.1:9944'; do sleep 5; done
          until cat out.txt | grep -s "Imported #2"; do sleep 5; done
        shell: bash
        timeout-minutes: 5

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - name: Build the Dockerfile
        run: docker build . -t polkadot-sdk-solochain-template
        timeout-minutes: 90
