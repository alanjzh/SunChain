[workspace]
members = [ "frame/base-fee", "frame/dynamic-fee", "frame/ethereum", "frame/evm", "frame/evm/precompile/sha3fips", "frame/evm/precompile/simple", "frame/evm/precompile/modexp", "frame/evm/precompile/ed25519", "frame/evm/precompile/bn128", "frame/evm/precompile/blake2", "frame/evm/precompile/bw6761", "frame/evm/precompile/bls12377", "frame/evm/precompile/bls12381", "frame/evm/precompile/dispatch", "frame/evm/precompile/curve25519", "frame/evm-chain-id", "frame/evm-polkavm", "frame/evm-polkavm/proc-macro", "frame/evm-polkavm/uapi", "frame/hotfix-sufficients", "client/api", "client/consensus", "client/rpc-core", "client/rpc", "client/rpc-v2", "client/rpc-v2/api", "client/rpc-v2/types", "client/db", "client/storage", "client/mapping-sync", "primitives/account", "primitives/consensus", "primitives/dynamic-fee", "primitives/evm", "primitives/rpc", "primitives/self-contained", "template/node", "template/runtime", "precompiles", "precompiles/macro", "precompiles/tests-external",]
resolver = "2"

[workspace.package]
authors = [ "Frontier developers <legal@bitarray.dev>",]
edition = "2021"
repository = "https://github.com/polkadot-evm/frontier/"

[workspace.dependencies]
async-trait = "0.1"
bitflags = "1.3.2"
derive_more = "1.0"
futures = "0.3.31"
hex-literal = "0.4.1"
impl-trait-for-tuples = "0.2.3"
kvdb-rocksdb = "0.19.0"
parity-db = "0.4.13"
parking_lot = "0.12.3"
proc-macro2 = "1.0.86"
quote = "1.0.38"
serde_json = "1.0"
similar-asserts = "1.7.0"
syn = "2.0.87"
thiserror = "2.0"
tokio = "1.45.0"

[profile.release]
panic = "unwind"

[profile.production]
inherits = "release"
lto = true
codegen-units = 1

