[workspace]
members = [
	"frame/base-fee",
	"frame/dynamic-fee",
	"frame/ethereum",
	"frame/evm",
	"frame/evm/precompile/sha3fips",
	"frame/evm/precompile/simple",
	"frame/evm/precompile/modexp",
	"frame/evm/precompile/ed25519",
	"frame/evm/precompile/bn128",
	"frame/evm/precompile/blake2",
	"frame/evm/precompile/bw6761",
	"frame/evm/precompile/bls12377",
	"frame/evm/precompile/bls12381",
	"frame/evm/precompile/dispatch",
	"frame/evm/precompile/curve25519",
	"frame/evm-chain-id",
	"frame/evm-polkavm",
	"frame/evm-polkavm/proc-macro",
	"frame/evm-polkavm/uapi",
	"frame/hotfix-sufficients",
	"client/api",
	"client/consensus",
	"client/rpc-core",
	"client/rpc",
	"client/rpc-v2",
	"client/rpc-v2/api",
	"client/rpc-v2/types",
	"client/db",
	"client/storage",
	"client/mapping-sync",
	"primitives/account",
	"primitives/consensus",
	"primitives/dynamic-fee",
	"primitives/evm",
	"primitives/rpc",
	"primitives/self-contained",
	"template/node",
	"template/runtime",
	"precompiles",
	"precompiles/macro",
	"precompiles/tests-external",
]
resolver = "2"

[workspace.package]
authors = ["Frontier developers <legal@bitarray.dev>"]
edition = "2021"
repository = "https://github.com/polkadot-evm/frontier/"

[workspace.dependencies]
async-trait = "0.1"
bitflags = "1.3.2"
bn = { package = "substrate-bn", version = "0.6", default-features = false }
clap = { version = "4.5", features = ["derive", "deprecated"] }
const-hex = { version = "1.14", default-features = false, features = ["alloc"] }
derive_more = "1.0"
environmental = { version = "1.1.4", default-features = false }
ethereum = { version = "0.18.2", default-features = false }
ethereum-types = { version = "0.15", default-features = false }
evm = { version = "0.43.2", default-features = false }
futures = "0.3.31"
hash-db = { version = "0.16.0", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hex-literal = "0.4.1"
impl-serde = { version = "0.5.0", default-features = false }
impl-trait-for-tuples = "0.2.3"
jsonrpsee = { version = "0.24.9" }
jsonrpsee-core = { version = "0.24.9" }
kvdb-rocksdb = "0.19.0"
libsecp256k1 = { version = "0.7.2", default-features = false }
log = { version = "0.4.27", default-features = false }
num_enum = { version = "0.7.3", default-features = false }
parity-db = "0.4.13"
parking_lot = "0.12.3"
proc-macro2 = "1.0.86"
quote = "1.0.38"
rlp = { version = "0.6", default-features = false }
scale-codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
similar-asserts = "1.7.0"
sqlx = { version = "0.7.4", default-features = false, features = ["macros"] }
syn = "2.0.87"
thiserror = "2.0"
tokio = "1.45.0"
parity-scale-codec = { version = "3.7.5", default-features = false }

