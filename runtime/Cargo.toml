[package]
name = "sunchain-runtime"
description = "A sunchain runtime built with OSE Environment."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
array-bytes = { workspace = true, default-features = true }
codec = { features = ["derive"], workspace = true }
frame-benchmarking = { optional = true, workspace = true }
frame-executive.workspace = true
frame-metadata-hash-extension.workspace = true
frame-support = { features = ["experimental"], workspace = true }
frame-system-benchmarking = { optional = true, workspace = true }
frame-system-rpc-runtime-api.workspace = true
frame-system.workspace = true
frame-try-runtime = { optional = true, workspace = true }
pallet-aura.workspace = true
pallet-balances.workspace = true
pallet-grandpa.workspace = true
pallet-sudo.workspace = true
pallet-template.workspace = true
pallet-timestamp.workspace = true
pallet-assets.workspace = true
pallet-exchange-core.workspace = true
pallet-oracle.workspace = true
pallet-insurance.workspace = true
pallet-liquidation.workspace = true
pallet-sunlead.workspace = true
exchange-primitives.workspace = true
pallet-transaction-payment-rpc-runtime-api.workspace = true
pallet-transaction-payment.workspace = true
scale-info = { features = ["derive", "serde"], workspace = true }
serde = { features = ["derive"], workspace = true }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
sp-api.workspace = true
sp-block-builder.workspace = true
sp-consensus-aura = { features = ["serde"], workspace = true }
sp-consensus-grandpa = { features = ["serde"], workspace = true }
sp-core = { features = ["serde"], workspace = true }
sp-genesis-builder.workspace = true
sp-inherents.workspace = true
sp-keyring.workspace = true
sp-offchain.workspace = true
sp-runtime = { features = ["serde"], workspace = true }
sp-session.workspace = true
sp-storage.workspace = true
sp-transaction-pool.workspace = true
sp-version = { features = ["serde"], workspace = true }

sunlead-primitives = { workspace = true, default-features = false }
sunlead-schedule = { workspace = true, default-features = false }

sp-authority-discovery.workspace = true
sp-consensus-babe.workspace = true
sp-staking.workspace = true
sp-io.workspace = true

pallet-im-online.workspace = true
pallet-authority-discovery = { workspace = true, default-features = false }
pallet-authorship.workspace = true
pallet-babe = { workspace = true, default-features = false }
pallet-offences = { workspace = true, default-features = false }
pallet-bags-list.workspace = true
pallet-session.workspace = true
pallet-staking.workspace = true
pallet-staking-reward-curve.workspace = true
pallet-staking-runtime-api.workspace = true
pallet-staking-runtime-api.default-features = false

frame-election-provider-support.workspace = true
# Cumulus primitives
# cumulus-pallet-weight-reclaim = { workspace = true }
hex-literal = { workspace = true }
# Frontier
fp-account = { workspace = true, features = ["serde"] }
fp-evm = { workspace = true, features = ["serde"] }
fp-rpc = { workspace = true }
fp-self-contained = { workspace = true, features = ["serde"] }

ethereum = { workspace = true }
# Frontier FRAME
pallet-base-fee = { workspace = true }
pallet-dynamic-fee = { workspace = true }
pallet-ethereum = {workspace = true}
pallet-evm = { workspace = true }
pallet-evm-precompile-modexp = { workspace = true }
pallet-evm-precompile-sha3fips = { workspace = true }
pallet-evm-precompile-simple = { workspace = true }
pallet-evm-chain-id = { workspace = true }

[build-dependencies]
substrate-wasm-builder = { optional = true, workspace = true, default-features = true }

[dev-dependencies]
codec.workspace = true
sp-core = { default-features = true, workspace = true }
sp-io = { default-features = true, workspace = true }
sp-runtime = { default-features = true, workspace = true }

[features]
default = ["std", "with-rocksdb-weights"]
with-rocksdb-weights = []
with-paritydb-weights = []
std = [
	"codec/std",
	"ethereum/std",
	"frame-benchmarking?/std",
	"frame-executive/std",
	"frame-metadata-hash-extension/std",
	"frame-support/std",
	"frame-system-benchmarking?/std",
	"frame-system-rpc-runtime-api/std",
	"frame-system/std",
	"frame-try-runtime?/std",
	"pallet-aura/std",
	"pallet-balances/std",
	"pallet-grandpa/std",
	"pallet-sudo/std",
	"pallet-template/std",
	"pallet-timestamp/std",
	"pallet-assets/std",
	"pallet-exchange-core/std",
	"pallet-oracle/std",
	"pallet-sunlead/std",
	"pallet-insurance/std",
	"pallet-liquidation/std",
	"exchange-primitives/std",
	"pallet-transaction-payment-rpc-runtime-api/std",
	"pallet-transaction-payment/std",
	"scale-info/std",
	"serde_json/std",
	"sp-api/std",
	"sunlead-primitives/std",
	"sunlead-schedule/std",
	"sp-block-builder/std",
	"sp-consensus-aura/std",
	"sp-consensus-grandpa/std",
	"sp-core/std",
	"sp-genesis-builder/std",
	"sp-inherents/std",
	"sp-keyring/std",
	"sp-offchain/std",
	"sp-runtime/std",
	"sp-session/std",
	"sp-storage/std",
	"sp-transaction-pool/std",
	"sp-version/std",
	"substrate-wasm-builder",
	"pallet-authority-discovery/std",
	"pallet-babe/std",
	"pallet-authorship/std",
	"pallet-bags-list/std",
	"pallet-im-online/std",
	"pallet-session/std",
	"pallet-staking/std",
	"pallet-staking-runtime-api/std",


	# Cumulus primitives
	#"cumulus-pallet-weight-reclaim/std",
	# Frontier
	"fp-account/std",
	"fp-evm/std",
	"fp-self-contained/std",
	"fp-rpc/std",
	# Frontier FRAME
	"pallet-base-fee/std",
	"pallet-dynamic-fee/std",
	"pallet-ethereum/std",
	"pallet-evm/std",
	"pallet-evm-precompile-modexp/std",
	"pallet-evm-precompile-sha3fips/std",
	"pallet-evm-precompile-simple/std",
	"pallet-evm-chain-id/std",
]

runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system-benchmarking/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-balances/runtime-benchmarks",
	"pallet-grandpa/runtime-benchmarks",
	"pallet-sudo/runtime-benchmarks",
	"pallet-template/runtime-benchmarks",
	"pallet-timestamp/runtime-benchmarks",
	"pallet-transaction-payment/runtime-benchmarks",
	# TEMPORARY: `pallet-assets/runtime-benchmarks` pulls in `pallet-revive` ->
	# `pallet-revive-fixtures`, whose build script cannot compile contract fixtures on
	# rustc 1.96-nightly (polkavm target JSON: `target-pointer-width` is a string there,
	# u16 is required). Re-enable together with `[pallet_assets, Assets]` in
	# `runtime/src/benchmarks.rs` once the toolchain is pinned to a version the vendored
	# polkadot-sdk supports. See docs Phase 1 §11.2.
	"pallet-exchange-core/runtime-benchmarks",
	"pallet-oracle/runtime-benchmarks",
	"pallet-sunlead/runtime-benchmarks",
	"pallet-insurance/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
	"pallet-staking/runtime-benchmarks",

	# for frontier
	"pallet-ethereum/runtime-benchmarks",
	"pallet-evm/runtime-benchmarks",
]

try-runtime = [
	"frame-executive/try-runtime",
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"frame-try-runtime/try-runtime",
	# `sp_runtime::traits::Checkable::unchecked_into_checked_i_know_what_i_am_doing` is declared
	# under `try-runtime`, and frontier's `UncheckedExtrinsic` implements it under the same cfg.
	# Leaving this out makes the trait gain a method the impl never sees -> E0046.
	"fp-self-contained/try-runtime",
	"pallet-aura/try-runtime",
	"pallet-balances/try-runtime",
	"pallet-grandpa/try-runtime",
	"pallet-sudo/try-runtime",
	"pallet-template/try-runtime",
	"pallet-sunlead/try-runtime",
	"pallet-timestamp/try-runtime",
	"pallet-assets/try-runtime",
	# Same cfg-mismatch class as `fp-self-contained`: the *implementor* needs the feature, not
	# (only) the crate that declares the trait. Frontier and staking were added to this runtime
	# later and their `try-runtime` entries were never filled in, so `try-runtime` builds broke
	# one crate at a time — every missing entry surfaces as a bogus E0046 in an unrelated file.
	"pallet-authority-discovery/try-runtime",
	"pallet-authorship/try-runtime",
	"pallet-babe/try-runtime",
	"pallet-bags-list/try-runtime",
	"pallet-base-fee/try-runtime",
	"pallet-dynamic-fee/try-runtime",
	"pallet-ethereum/try-runtime",
	"pallet-evm/try-runtime",
	"pallet-evm-chain-id/try-runtime",
	"pallet-im-online/try-runtime",
	"pallet-offences/try-runtime",
	"pallet-session/try-runtime",
	"pallet-staking/try-runtime",
	"pallet-exchange-core/try-runtime",
	"pallet-oracle/try-runtime",
	"pallet-insurance/try-runtime",
	"pallet-liquidation/try-runtime",
	"pallet-transaction-payment/try-runtime",
	"sp-runtime/try-runtime",
]

# Enable the metadata hash generation.
#
# This is hidden behind a feature because it increases the compile time.
# The wasm binary needs to be compiled twice, once to fetch the metadata,
# generate the metadata hash and then a second time with the
# `RUNTIME_METADATA_HASH` environment variable set for the `CheckMetadataHash`
# extension.
metadata-hash = ["substrate-wasm-builder/metadata-hash"]

# A convenience feature for enabling things when doing a build
# for an on-chain release.
on-chain-release-build = ["metadata-hash", "sp-api/disable-logging"]
